services:
  mqtt-latest-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mqtt-latest-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Similar to Spring profiles. Supports comma-separated profiles.
      CONFIG_PROFILES: "local"

      # Optional comma-separated files or directories.
      # Directories load application.yml and application-{profile}.yml.
      CONFIG_LOCATIONS: "/app/app/config,/config"

      # Environment variables still override YAML when supplied.
      # MQTT_HOST: "mqtt"
      # MQTT_PORT: "1883"
    volumes:
      # Optional external overrides. Place application.yml and/or
      # application-local.yml in ./config on the host.
      - ./config:/config:ro
